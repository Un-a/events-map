<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мероприятия на выходные</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="icon" type="image/png" href="favicons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicons/favicon.svg" />
  <link rel="shortcut icon" href="favicons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="EventsMap" />
  <link rel="manifest" href="favicons/site.webmanifest" />
</head>
<body>
  <h1>Детские мероприятия на выходные 12-13 сентября</h1>
  <div class="controls">
    <button class="btn" id="btn-saturday" onclick="showDay('saturday')"><span class="icon-circle icon-red"></span> Сб</button>
    <button class="btn" id="btn-sunday" onclick="showDay('sunday')"><span class="icon-circle icon-blue"></span> Вс</button>
    <button class="btn active" id="btn-all" onclick="showDay('all')"><span class="icon-circle icon-red"></span> <span class="icon-circle icon-blue"></span> Все</button>
  </div>
  <div id="map"></div>

  <div id="bottom-sheet" class="bottom-sheet">
    <button class="bottom-sheet-close" onclick="closeBottomSheet()">✕</button>
    <div class="bottom-sheet-content"></div>
  </div>

  <script src="https://api-maps.yandex.ru/2.1/?apikey=YOUR_API_KEY&lang=ru_RU"></script>
  <script src="map.js"></script>
</body>
</html>
